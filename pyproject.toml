[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "GATE-security"
version = "0.3.0"
description = "Agent Execution Guard with Invariant Safety - Zero-trust security wrapper for LLM agents"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "GATE Team", email = "GATE@example.com"}
]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pydantic>=2.0.0",
    "numpy>=1.24.0",
    "faiss-cpu>=1.7.0",
    "sentence-transformers>=2.2.0",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
langchain = [
    "langchain>=0.1.0",
    "langchain-openai>=0.0.5",
]
langgraph = [
    "langgraph>=0.0.30",
    "langchain>=0.1.0",
]
openai-agents = [
    "openai-agents>=0.0.1",
]
crewai = [
    "crewai>=0.28.0",
]
all = [
    "GATE-security[langchain,langgraph,openai-agents,crewai]",
]

firewall = ["sentence-transformers>=2.2,<3"]
audit = []
gemini = ["google-generativeai", "langchain"]
llamaindex = ["llama-index"]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/GATE-security/GATE"
Documentation = "https://github.com/GATE-security/GATE#readme"
Repository = "https://github.com/GATE-security/GATE"
Issues = "https://github.com/GATE-security/GATE/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["gate*"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true