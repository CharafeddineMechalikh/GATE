[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "GATE-security"
version = "1.1.1"
description = "Zero-trust runtime guardrails for LLM agents: validate every tool call before execution in LangChain, LangGraph, OpenAI Agents SDK, and CrewAI."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Charafeddine Mechalikh"}
]
requires-python = ">=3.9"
keywords = [
    "AI agent security",
    "LLM security",
    "agent guardrails",
    "AI guardrails",
    "tool call validation",
    "prompt injection defense",
    "runtime security",
    "zero trust",
    "agent safety",
    "AI safety",
    "LangChain",
    "LangGraph",
    "OpenAI Agents SDK",
    "CrewAI",
    "semantic firewall",
    "control barrier function",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "pydantic>=2.0.0",
    "numpy>=1.24.0",
    "faiss-cpu>=1.7.0",
    "sentence-transformers>=2.2.0",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
langchain = [
    "langchain>=0.1.0",
    "langchain-openai>=0.0.5",
]
langgraph = [
    "langgraph>=0.0.30",
    "langchain>=0.1.0",
]
openai-agents = [
    "openai-agents>=0.0.1",
]
crewai = [
    "crewai>=0.28.0",
]
all = [
    "GATE-security[langchain,langgraph,openai-agents,crewai]",
]

firewall = ["sentence-transformers>=2.2.0"]
audit = []
gemini = ["google-generativeai", "langchain"]
llamaindex = ["llama-index"]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/CharafeddineMechalikh/GATE"
Documentation = "https://charafeddinemechalikh.github.io/GATE/"
Repository = "https://github.com/CharafeddineMechalikh/GATE"
Changelog = "https://github.com/CharafeddineMechalikh/GATE/blob/main/CHANGELOG.md"
Citation = "https://github.com/CharafeddineMechalikh/GATE/blob/main/CITATION.cff"
Issues = "https://github.com/CharafeddineMechalikh/GATE/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["gate*"]

[tool.setuptools.package-data]
gate = ["policy.yaml", "unsafe_corpus.txt"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true